[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning-payment-channel"
version = "0.1.0"
description = "An educational Bitcoin Lightning penalty-channel engine"
requires-python = ">=3.11,<3.14"
dependencies = ["coincurve==21.0.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
lnlab = "lnchannel.cli:main"

[tool.setuptools.packages.find]
include = ["lnchannel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: starts isolated Bitcoin Core processes"]
